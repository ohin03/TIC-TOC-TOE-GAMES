<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe | Ultimate Battle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- ================= START SCREEN ================= -->

    <div class="player-screen" id="playerScreen">

        <div class="setup-card">

            <div class="game-logo">
                <span>⭕</span>
                <span>❌</span>
            </div>

            <div class="setup-badge">
                ✦ 2 PLAYER GAME
            </div>

            <h1>Tic Tac Toe</h1>

            <p class="subtitle">
                The ultimate X vs O battle
            </p>


            <div class="player-inputs">

                <div class="player-input-card player-o-card">

                    <div class="symbol o-symbol">O</div>

                    <div class="input-content">
                        <label>PLAYER O</label>

                        <input
                            type="text"
                            id="playerO"
                            placeholder="Enter player name"
                            maxlength="18"
                        >
                    </div>

                </div>


                <div class="vs">VS</div>


                <div class="player-input-card player-x-card">

                    <div class="symbol x-symbol">X</div>

                    <div class="input-content">
                        <label>PLAYER X</label>

                        <input
                            type="text"
                            id="playerX"
                            placeholder="Enter player name"
                            maxlength="18"
                        >
                    </div>

                </div>

            </div>


            <button id="start-btn" class="primary-btn">

                <span>Start Battle</span>

                <span class="btn-arrow">→</span>

            </button>

            <div class="game-tip">
                ⚡ First player to connect 3 symbols wins
            </div>

        </div>

    </div>


    <!-- ================= GAME ================= -->

    <main id="gameScreen" class="game-screen hidden">

        <header class="game-header">

            <div class="brand">

                <div class="brand-icon">
                    XO
                </div>

                <div>
                    <span>ULTIMATE</span>
                    <h2>Tic Tac Toe</h2>
                </div>

            </div>


            <button id="reset_btn" class="reset-btn">
                ↻ Reset
            </button>

        </header>


        <!-- Scoreboard -->

        <section class="scoreboard">

            <div class="player-card player-card-o">

                <div class="score-symbol o-symbol">
                    O
                </div>

                <div class="player-info">
                    <span>PLAYER O</span>
                    <strong id="playerODisplay">
                        Player O
                    </strong>
                </div>

                <div class="score">
                    <span>SCORE</span>
                    <strong id="scoreO">0</strong>
                </div>

            </div>


            <div class="versus">
                <span>VS</span>
            </div>


            <div class="player-card player-card-x">

                <div class="score-symbol x-symbol">
                    X
                </div>

                <div class="player-info">
                    <span>PLAYER X</span>
                    <strong id="playerXDisplay">
                        Player X
                    </strong>
                </div>

                <div class="score">
                    <span>SCORE</span>
                    <strong id="scoreX">0</strong>
                </div>

            </div>

        </section>


        <!-- Turn -->

        <div class="turn-container">

            <div class="turn-dot"></div>

            <span id="turnText">
                Player O's Turn
            </span>

        </div>


        <!-- Board -->

        <section class="board-wrapper">

            <div class="game">

                <button class="box" data-index="0"></button>
                <button class="box" data-index="1"></button>
                <button class="box" data-index="2"></button>

                <button class="box" data-index="3"></button>
                <button class="box" data-index="4"></button>
                <button class="box" data-index="5"></button>

                <button class="box" data-index="6"></button>
                <button class="box" data-index="7"></button>
                <button class="box" data-index="8"></button>

            </div>

        </section>


        <div class="bottom-tip">
            <span>⚡</span>
            Connect 3 symbols in a row to win
        </div>

    </main>


    <!-- ================= RESULT MODAL ================= -->

    <div class="msg-container hide" id="resultModal">

        <div class="result-card">

            <div class="result-confetti">
                ✦ ✧ ✦
            </div>

            <div class="result-icon" id="resultIcon">
                🏆
            </div>

            <span class="result-label" id="resultLabel">
                VICTORY
            </span>

            <h3 id="msg">
                Winner
            </h3>

            <p id="resultDescription">
                Amazing game!
            </p>


            <div class="result-actions">

                <button id="new-btn" class="primary-btn">
                    <span>Play Again</span>
                    <span>↻</span>
                </button>

                <button id="home-btn" class="secondary-btn">
                    Change Players
                </button>

            </div>

        </div>

    </div>


    <script src="index.js"></script>

</body>
</html>
